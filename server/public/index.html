<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bara IoT - Water Level & Automation Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-card: rgba(18, 26, 43, 0.7);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-blue: #0ea5e9;
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-card);
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-pill.offline {
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            border-color: rgba(244, 63, 94, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 10px currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .grid-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        /* Tangki Air Visual */
        .tank-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .tank-cylinder {
            width: 180px;
            height: 320px;
            background: rgba(255, 255, 255, 0.03);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }

        .water-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: linear-gradient(180deg, rgba(14, 165, 233, 0.8) 0%, rgba(2, 132, 199, 0.95) 100%);
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 0 26px 26px;
        }

        .water-fill::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            right: 0;
            height: 20px;
            background: rgba(56, 189, 248, 0.7);
            border-radius: 50%;
            filter: blur(2px);
        }

        .tank-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* Metric Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.2rem;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .metric-val {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
        }

        .metric-unit {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-left: 4px;
        }

        /* Log console */
        .console-box {
            background: #050811;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            max-height: 250px;
            overflow-y: auto;
            color: #38bdf8;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .console-line {
            display: flex;
            gap: 12px;
        }

        .console-time {
            color: var(--text-muted);
        }

        .state-tag {
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }
        .state-LOW { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .state-FULL { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .state-NORMAL { background: rgba(14, 165, 233, 0.2); color: #38bdf8; }
        .state-OVERFLOW { background: rgba(244, 63, 94, 0.2); color: #fb7185; }
    </style>
</head>
<body>
    <header>
        <div class="brand-badge">
            <h1>BARA-IOT WATER LEVEL</h1>
            <span style="color: var(--text-muted); font-size: 0.9rem;">NodeMCU ESP8266 Live Telemetry</span>
        </div>
        <div id="connectionPill" class="status-pill offline">
            <span class="pulse-dot"></span>
            <span id="connectionText">Menghubungkan ke Server...</span>
        </div>
    </header>

    <div class="grid-container">
        <!-- Visual Tangki -->
        <div class="card tank-wrapper">
            <h3 style="font-size: 1.1rem; color: var(--text-muted);">Visualisasi Tangki Air</h3>
            <div class="tank-cylinder">
                <div class="tank-percentage" id="tankPercent">0%</div>
                <div class="water-fill" id="waterFill"></div>
            </div>
            <div id="stateBadge" class="state-tag state-NORMAL">STANDBY</div>
        </div>

        <!-- Telemetri & Log -->
        <div class="card">
            <h3 style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1.2rem;">Telemetri NodeMCU</h3>
            
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Kedalaman Air</div>
                    <div class="metric-val"><span id="waterDepth">0</span><span class="metric-unit">cm</span></div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Jarak Sensor (Raw)</div>
                    <div class="metric-val"><span id="rawDist">0</span><span class="metric-unit">cm</span></div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Status Pompa</div>
                    <div class="metric-val" id="pumpAction" style="color: #38bdf8;">IDLE</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Wi-Fi RSSI</div>
                    <div class="metric-val"><span id="wifiRssi">--</span><span class="metric-unit">dBm</span></div>
                </div>
            </div>

            <h3 style="font-size: 1rem; color: var(--text-muted); margin-bottom: 0.8rem;">Live MQTT Message Stream</h3>
            <div class="console-box" id="consoleBox">
                <div class="console-line">
                    <span class="console-time">[00:00:00]</span>
                    <span>Menunggu data telemetry dari NodeMCU...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const wsUrl = `ws://${window.location.host}`;
        let ws = new WebSocket(wsUrl);

        const connectionPill = document.getElementById('connectionPill');
        const connectionText = document.getElementById('connectionText');
        const tankPercent = document.getElementById('tankPercent');
        const waterFill = document.getElementById('waterFill');
        const waterDepth = document.getElementById('waterDepth');
        const rawDist = document.getElementById('rawDist');
        const pumpAction = document.getElementById('pumpAction');
        const wifiRssi = document.getElementById('wifiRssi');
        const stateBadge = document.getElementById('stateBadge');
        const consoleBox = document.getElementById('consoleBox');

        function addLog(time, text) {
            const line = document.createElement('div');
            line.className = 'console-line';
            line.innerHTML = `<span class="console-time">[${time}]</span> <span>${text}</span>`;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        ws.onopen = () => {
            connectionPill.className = 'status-pill';
            connectionText.innerText = 'MQTT Broker Connected';
            addLog(new Date().toLocaleTimeString(), 'Terhubung ke server Dashboard.');
        };

        ws.onclose = () => {
            connectionPill.className = 'status-pill offline';
            connectionText.innerText = 'Server Disconnected';
            setTimeout(() => { location.reload(); }, 3000);
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === 'client_connect') {
                addLog(msg.time, `✅ NodeMCU Terhubung: ${msg.id}`);
            } else if (msg.type === 'client_disconnect') {
                addLog(msg.time, `❌ NodeMCU Terputus: ${msg.id}`);
            } else if (msg.type === 'mqtt_message') {
                addLog(msg.time, `📥 [${msg.topic}] ${msg.payload}`);

                if (msg.topic === 'home/water/telemetry') {
                    try {
                        const data = JSON.parse(msg.payload);
                        const pct = parseFloat(data.percentage) || 0;
                        tankPercent.innerText = `${pct.toFixed(0)}%`;
                        waterFill.style.height = `${Math.min(100, Math.max(0, pct))}%`;
                        waterDepth.innerText = data.water_depth_cm;
                        rawDist.innerText = data.raw_distance_cm;
                        wifiRssi.innerText = data.rssi || '--';
                        pumpAction.innerText = data.pump_action;

                        stateBadge.innerText = data.state;
                        stateBadge.className = `state-tag state-${data.state}`;
                    } catch (e) {
                        console.error(e);
                    }
                }
            }
        };
    </script>
</body>
</html>
